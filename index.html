<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1976d2">
<title id="pageTitle">H5 健康证明二维码生成器</title>
<script src="./qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #eaf4fb;
    color: #2c3e50;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ============ 生成器页面 ============ */
  .gen-page {
    max-width: 540px;
    margin: 0 auto;
    padding: 14px 14px 90px;
  }
  .gen-header {
    background: linear-gradient(135deg, #1e88e5, #1976d2);
    color: #fff;
    padding: 18px 16px;
    border-radius: 12px;
    margin-bottom: 14px;
    box-shadow: 0 4px 16px rgba(25,118,210,.25);
  }
  .gen-header h1 { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
  .gen-header p { font-size: 12px; opacity: .9; line-height: 1.5; }
  /* 生成器页标题/描述也是可编辑的 */
  .gen-header h1 input {
    width: 100%;
    background: rgba(255,255,255,.15);
    color: #fff;
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 18px;
    font-weight: 600;
    font-family: inherit;
    outline: none;
    transition: border-color .15s, background .15s;
  }
  .gen-header h1 input:focus {
    border-color: rgba(255,255,255,.6);
    background: rgba(255,255,255,.22);
  }
  .gen-header p input {
    width: 100%;
    background: rgba(255,255,255,.15);
    color: #fff;
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    opacity: .95;
    font-family: inherit;
    outline: none;
    transition: border-color .15s, background .15s;
  }
  .gen-header p input::placeholder { color: rgba(255,255,255,.55); }
  .gen-header p input:focus {
    border-color: rgba(255,255,255,.6);
    background: rgba(255,255,255,.22);
  }

  .gen-card {
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,.06);
    margin-bottom: 14px;
  }
  .gen-card h2 {
    font-size: 15px;
    margin-bottom: 12px;
    color: #1976d2;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .gen-card h2::before {
    content: ''; width: 3px; height: 14px; background: #1976d2; border-radius: 2px;
  }
  .field-row { display: flex; gap: 10px; margin-bottom: 10px; }
  .field { flex: 1; display: flex; flex-direction: column; }
  .field label {
    font-size: 12px; color: #6b7c93; margin-bottom: 4px; font-weight: 500;
  }
  .field input, .field select, .field textarea {
    border: 1px solid #dfe6ef;
    border-radius: 8px;
    padding: 9px 10px;
    font-size: 14px;
    outline: none;
    transition: border-color .15s;
    font-family: inherit;
    background: #f8fafc;
    width: 100%;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    border-color: #1976d2;
    background: #fff;
  }
  .field textarea { resize: vertical; min-height: 38px; }

  /* 照片上传 */
  .photo-uploader { display: flex; align-items: center; gap: 12px; }
  .photo-preview {
    width: 72px; height: 96px;
    border: 1px dashed #c0cfde;
    border-radius: 6px;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background: #f8fafc;
    flex-shrink: 0;
    color: #b0bec5; font-size: 11px;
  }
  .photo-preview img { width: 100%; height: 100%; object-fit: cover; }
  .photo-actions { flex: 1; }
  .photo-actions input[type="file"] { display: none; }
  .photo-actions label, .photo-btn {
    display: inline-block;
    padding: 7px 12px;
    background: #e3f2fd;
    color: #1976d2;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    margin-right: 6px;
    margin-bottom: 6px;
    border: none;
  }
  .photo-actions label:active, .photo-btn:active { background: #bbdefb; }
  .photo-actions .tip { display: block; margin-top: 4px; font-size: 11px; color: #94a8bf; line-height: 1.5; }

  /* 按钮 */
  .btn-row { display: flex; gap: 10px; margin-top: 14px; }
  .btn {
    flex: 1;
    padding: 11px 12px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: transform .1s, opacity .15s;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: #1976d2; color: #fff; }
  .btn-secondary { background: #e3f2fd; color: #1976d2; }
  .btn-block { width: 100%; }

  /* 二维码预览 */
  .qr-preview {
    text-align: center;
    padding: 18px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,.06);
    margin-bottom: 14px;
  }
  .qr-preview h3 { margin-bottom: 12px; color: #1976d2; font-size: 15px; }
  .qr-box {
    display: flex; justify-content: center; align-items: center;
    padding: 14px;
    background: #fff;
    border: 1px solid #e3f2fd;
    border-radius: 10px;
    margin-bottom: 12px;
    min-height: 220px;
  }
  #qrcode img { display: block; }
  .qr-placeholder { color: #b0bec5; font-size: 13px; line-height: 1.6; }
  .qr-meta {
    font-size: 11px; color: #6b7c93;
    background: #f8fafc; padding: 8px; border-radius: 6px;
    word-break: break-all; line-height: 1.5;
    text-align: left;
    max-height: 60px;
    overflow-y: auto;
  }

  /* ============ 证书展示页面 ============ */
  .cert-page {
    display: none;
    background: #eaf4fb;
    min-height: 100vh;
    padding: 14px 12px 30px;
  }
  .cert-page.active { display: block; }
  .cert-card {
    background: #fff;
    border-radius: 12px;
    padding: 22px 18px;
    max-width: 480px;
    margin: 0 auto;
    box-shadow: 0 2px 10px rgba(0,0,0,.05);
  }
  .cert-title {
    text-align: center;
    font-size: 20px;
    font-weight: 700;
    color: #2c3e50;
    line-height: 1.4;
    margin: 0 8px 12px;
  }
  .cert-divider {
    height: 2px;
    background: #b3d9f2;
    margin: 0 0 24px;
    border-radius: 1px;
  }
  .cert-row {
    display: flex;
    margin-bottom: 14px;
    font-size: 15px;
    line-height: 1.5;
  }
  .cert-label {
    color: #2196f3;
    font-weight: 500;
    flex-shrink: 0;
    width: 90px;
  }
  .cert-value {
    color: #2c3e50;
    flex: 1;
    word-break: break-all;
    padding-right: 4px;
  }
  .cert-status-row {
    display: flex; align-items: center; margin-bottom: 18px;
    font-size: 15px;
  }
  .cert-status-row .cert-label { width: 90px; }
  .cert-status {
    display: inline-block;
    background: #22c55e;
    color: #fff;
    font-size: 14px;
    padding: 6px 16px;
    border-radius: 20px;
    font-weight: 500;
    margin-left: 8px;
  }
  .cert-status-row .cert-value { display: flex; align-items: center; }
  .cert-photo-wrap { text-align: center; margin: 8px 0 24px; }
  .cert-photo {
    width: 110px; height: 145px;
    object-fit: cover;
    border-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,.1);
    background: #f0f0f0;
  }
  .cert-photo-placeholder {
    width: 110px; height: 145px;
    display: flex; align-items: center; justify-content: center;
    color: #b0bec5; font-size: 12px;
    background: #f8fafc;
    border-radius: 4px;
    margin: 0 auto;
  }
  .cert-qr-section { text-align: center; margin-top: 16px; }
  .cert-qr-tip { font-size: 14px; color: #2c3e50; margin-bottom: 10px; }
  .cert-qr-img {
    width: 160px; height: 160px;
    border: 1px solid #f0f0f0;
    padding: 6px;
    background: #fff;
    border-radius: 6px;
  }

  /* Toast */
  .toast {
    position: fixed; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,.8);
    color: #fff;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    z-index: 9999;
    opacity: 0;
    transition: opacity .2s;
    pointer-events: none;
    max-width: 80%;
    text-align: center;
  }
  .toast.show { opacity: 1; }

  /* 错误提示 */
  .err-box {
    color: #c62828;
    background: #ffebee;
    border: 1px solid #ffcdd2;
    padding: 10px;
    border-radius: 6px;
    font-size: 12px;
    margin-top: 8px;
    word-break: break-all;
  }

  /* 警告提示(容量回退等) */
  .warn-box {
    color: #ef6c00;
    background: #fff3e0;
    border: 1px solid #ffe0b2;
    padding: 10px;
    border-radius: 6px;
    font-size: 12px;
    margin-top: 8px;
    word-break: break-all;
  }

  @media (min-width: 600px) {
    .gen-page { padding: 24px 24px 100px; }
  }
</style>
</head>

<script>
'use strict';

/* ============ 工具 ============ */
var $ = function(id) { return document.getElementById(id); };
function toast(msg) {
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 1800);
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

/* ============ 状态 ============ */
var photoDataUrl = '';   // 照片 base64 (不进二维码,只用于本机预览)
var lastQrDataUrl = '';  // 最近一次生成的二维码 dataURL,供下载用

/* ============ 数据收集 ============ */
function collectForm() {
  return {
    genTitle: $('f-genTitle').value.trim() || 'H5 健康证明二维码生成器',
    title1:  $('f-title1').value.trim() || '广东省食品从业人员',
    title2:  $('f-title2').value.trim() || '健康证明验证',
    name:    $('f-name').value.trim()   || '未填写',
    sex:     $('f-sex').value           || '男',
    id:      $('f-id').value.trim()     || '未填写',
    date:    $('f-date').value.trim()   || '未填写',
    org:     $('f-org').value.trim()    || '未填写',
    valid:   $('f-valid').value.trim()  || '壹年',
    status:  $('f-status').value.trim() || '验证有效'
  };
}

/* 构造证书页 URL (二维码内容) — 包含照片 URL(如有) */
function buildCertUrl(data, skipPhoto) {
  data = data || collectForm();
  var params = new URLSearchParams();
  params.set('cert', '1');
  for (var k in data) {
    // genDesc 不传证书页(只是生成器自己的副标题)
    if (k === 'genDesc') continue;
    if (data[k] && k !== 'photo') params.set(k, data[k]);
  }
  if (!skipPhoto && photoDataUrl) params.set('photo', photoDataUrl);
  // 必须用绝对 URL!微信扫一扫只认 http:// 开头,纯 /path 会识别成根路径
  return location.origin + location.pathname + '?' + params.toString();
}

/* 构造编辑链接 (生成器端回填用,不在证书页显示) */
function buildEditUrl(data) {
  data = data || collectForm();
  var params = new URLSearchParams();
  for (var k in data) {
    if (data[k]) params.set('e_' + k, data[k]);
  }
  return location.origin + location.pathname + '?' + params.toString();
}

/* ============ 二维码生成 (核心修复) ============ */
/* 用 qrcode-generator 库算出模块矩阵,自绘 canvas,清晰且下载可靠 */
function makeQrDataUrl(text, pixelSize) {
  pixelSize = pixelSize || 6;  // 每模块像素数
  try {
    var qr = qrcode(0, 'M');   // typeNumber=0 自动, 纠错级别 M
    qr.addData(text);
    qr.make();
    var count = qr.getModuleCount();
    var margin = 4;  // 留白 4 模块 (扫码识别需要)
    var total = count + margin * 2;
    var canvas = document.createElement('canvas');
    canvas.width = total * pixelSize;
    canvas.height = total * pixelSize;
    var ctx = canvas.getContext('2d');
    // 白底
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // 黑模块
    ctx.fillStyle = '#000000';
    for (var r = 0; r < count; r++) {
      for (var c = 0; c < count; c++) {
        if (qr.isDark(r, c)) {
          ctx.fillRect((c + margin) * pixelSize, (r + margin) * pixelSize, pixelSize, pixelSize);
        }
      }
    }
    return canvas.toDataURL('image/png');
  } catch (e) {
    console.error('QR 生成失败:', e);
    return '';
  }
}

function renderQr() {
  var data = collectForm();
  var url = buildCertUrl(data, false);
  // 容量保护: 二维码最长约 2953 字节。照片 base64 太大时无法入码,
  // 自动回退为不含照片的二维码,避免整页"生成失败"
  var photoDropped = false;
  if (url.length > 2953 && photoDataUrl) {
    url = buildCertUrl(data, true);
    photoDropped = true;
  }
  $('qrUrl').innerHTML = '<strong>扫码访问:</strong> ' + escapeHtml(url);
  $('qrError').innerHTML = photoDropped
    ? '<div class="warn-box">⚠️ 照片过大无法放入二维码,已生成不含照片的版本。需配服务器/云存储上传模式才能扫码显示照片。</div>'
    : '';

  var box = $('qrcode');
  box.innerHTML = '';

  try {
    var dataUrl = makeQrDataUrl(url, 6);
    if (!dataUrl) {
      throw new Error('二维码生成返回空');
    }
    lastQrDataUrl = dataUrl;
    var img = document.createElement('img');
    img.src = dataUrl;
    img.style.width = '220px';
    img.style.height = '220px';
    img.alt = '健康证明二维码';
    box.appendChild(img);
  } catch (e) {
    lastQrDataUrl = '';
    box.innerHTML = '<div class="qr-placeholder">❌ 生成失败: ' + escapeHtml(e.message) + '</div>';
    $('qrError').innerHTML = '<div class="err-box">' + escapeHtml(e.message) + '</div>';
  }
}

/* ============ 照片处理 ============ */
$('photoInput').addEventListener('change', function(e) {
  var file = e.target.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) {
    toast('照片不能超过 5MB');
    return;
  }
  // 1) 压缩到 300px 宽,jpg 0.7
  var reader = new FileReader();
  reader.onload = function(ev) {
    var img = new Image();
    img.onload = function() {
      var maxW = 300;
      var scale = Math.min(1, maxW / img.width);
      var w = Math.round(img.width * scale);
      var h = Math.round(img.height * scale);
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      var c = canvas.getContext('2d');
      c.drawImage(img, 0, 0, w, h);
      canvas.toBlob(function(blob) {
        if (!blob) { toast('照片处理失败'); return; }
        // 2) 上传到后端,拿到公网 URL
        uploadPhoto(blob);
      }, 'image/jpeg', 0.7);
    };
    img.onerror = function() { toast('照片读取失败'); };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

function uploadPhoto(blob) {
  toast('正在上传照片...');
  $('photoPreview').innerHTML = '<span>上传中...</span>';
  var fd = new FormData();
  fd.append('photo', blob, 'photo.jpg');
  fetch('/upload', { method: 'POST', body: fd })
    .then(function(res) { return res.json(); })
    .then(function(data) {
      if (!data.ok) throw new Error(data.error || '上传失败');
      photoDataUrl = data.url;  // 存公网 URL
      $('photoPreview').innerHTML = '<img src="' + photoDataUrl + '">';
      renderQr();              // 重新生成二维码(把 photo URL 编进去)
      toast('照片已上传并加入二维码');
    })
    .catch(function(err) {
      photoDataUrl = '';
      $('photoPreview').innerHTML = '<span>上传失败</span>';
      toast('上传失败: ' + err.message);
    });
}

$('clearPhoto').addEventListener('click', function() {
  photoDataUrl = '';
  $('photoPreview').innerHTML = '<span>暂无照片</span>';
  $('photoInput').value = '';
  toast('照片已清除');
});

/* ============ 输入联动 ============ */
var fieldIds = ['f-title1','f-title2','f-name','f-sex','f-id','f-date','f-org','f-valid','f-status'];
fieldIds.forEach(function(id) {
  $(id).addEventListener('input', renderQr);
  $(id).addEventListener('change', renderQr);
});

// 页面标题/副标题 — 同步浏览器 title + 重新生成二维码(genTitle 要编进 URL)
function syncPageMeta() {
  var t = $('f-genTitle').value.trim();
  if (t) $('pageTitle').textContent = t;
}
$('f-genTitle').addEventListener('input', function() {
  syncPageMeta();
  renderQr();   // genTitle 改了,二维码也要重新生成
});
$('f-genTitle').addEventListener('change', function() {
  syncPageMeta();
  renderQr();
});
$('f-genDesc').addEventListener('input', syncPageMeta);
$('f-genDesc').addEventListener('change', syncPageMeta);
syncPageMeta();

/* ============ 下载二维码 ============ */
$('downloadQr').addEventListener('click', function() {
  if (!lastQrDataUrl) {
    toast('请先填写信息生成二维码');
    return;
  }
  var a = document.createElement('a');
  a.download = '健康证明二维码.png';
  a.href = lastQrDataUrl;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  toast('二维码已下载');
});

/* ============ 复制链接 ============ */
$('copyLink').addEventListener('click', function() {
  var url = buildCertUrl();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(function() {
      toast('链接已复制');
    }).catch(function() {
      fallbackCopy(url);
    });
  } else {
    fallbackCopy(url);
  }
});
function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.top = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    toast('链接已复制');
  } catch (e) {
    toast('复制失败,请手动选中链接复制');
  }
  document.body.removeChild(ta);
}

/* ============ 证书页面渲染 (只读,无任何修改入口) ============ */
function showCertPage(data) {
  // 如果没传 data,尝试从 URL 读
  if (!data) {
    var params = new URLSearchParams(location.search);
    if (params.get('cert') === '1') {
      data = {
        genTitle: params.get('genTitle') || '',
        title1: params.get('title1') || '广东省食品从业人员',
        title2: params.get('title2') || '健康证明验证',
        name:   params.get('name')   || '-',
        sex:    params.get('sex')    || '-',
        id:     params.get('id')     || '-',
        date:   params.get('date')   || '-',
        org:    params.get('org')    || '-',
        valid:  params.get('valid')  || '壹年',
        status: params.get('status') || '验证有效'
      };
    } else {
      data = collectForm();
    }
  }

  // 渲染标题(两行,HTML escape 防注入)
  $('c-title').innerHTML = escapeHtml(data.title1) + '<br>' + escapeHtml(data.title2);
  // 同步浏览器 <title>(微信顶栏显示)— 用生成器传入的 genTitle,没有就用证书标题兜底
  var pageTitle = data.genTitle || (data.title1 + data.title2);
  if (!pageTitle) pageTitle = '健康证明验证';
  $('pageTitle').textContent = pageTitle;

  $('c-name').textContent   = data.name;
  $('c-sex').textContent    = data.sex;
  $('c-id').textContent     = data.id;
  $('c-date').textContent   = data.date;
  $('c-org').textContent    = data.org;
  $('c-valid').textContent  = data.valid;
  $('c-status').textContent = data.status;

  // 照片: 优先用 URL 参数里的 photo URL(任何人扫码都能看到),其次本机 localStorage 兜底
  var photo = '';
  if (data && data.photo) photo = data.photo;
  if (!photo) {
    var params = new URLSearchParams(location.search);
    photo = params.get('photo') || '';
  }
  if (!photo) {
    try { photo = localStorage.getItem('cert_photo') || ''; } catch (e) {}
  }
  var wrap = $('c-photo-wrap');
  if (photo) {
    wrap.innerHTML = '<img class="cert-photo" src="' + photo + '" alt="照片" crossorigin="anonymous">';
  } else {
    wrap.innerHTML = '<div class="cert-photo-placeholder">暂无照片</div>';
  }

  // 底部"再次验证"二维码 — 用本地库自绘 canvas,不依赖外部 API
  // 这次不加 photo(避免递归无限增长)
  var verifyUrl = buildCertUrl(data, true);
  var qrDataUrl = makeQrDataUrl(verifyUrl, 5);
  if (qrDataUrl) {
    $('c-qr').src = qrDataUrl;
  } else {
    $('c-qr').alt = '二维码生成失败';
  }

  $('genPage').style.display = 'none';
  $('certPage').classList.add('active');
  window.scrollTo(0, 0);
}

/* ============ 编辑链接回填 (生成器端用) ============ */
function prefillFromEditUrl() {
  var params = new URLSearchParams(location.search);
  var hasEdit = false;
  ['genTitle','genDesc','title1','title2','name','sex','id','date','org','valid','status'].forEach(function(k) {
    var v = params.get('e_' + k);
    if (v !== null) {
      var el = $('f-' + k);
      if (el) {
        el.value = v;
        hasEdit = true;
      }
    }
  });
  return hasEdit;
}

/* ============ 启动 ============ */
window.addEventListener('DOMContentLoaded', function() {
  // 检查库是否加载成功
  if (typeof qrcode === 'undefined') {
    $('qrcode').innerHTML = '<div class="qr-placeholder">❌ 二维码库加载失败,请检查网络后刷新</div>';
    $('qrError').innerHTML = '<div class="err-box">qrcode.min.js 未加载,请刷新页面重试</div>';
    return;
  }

  var params = new URLSearchParams(location.search);

  // 场景1: 扫码进入证书页 (?cert=1) — 只读,无修改入口
  if (params.get('cert') === '1') {
    showCertPage();
    return;
  }

  // 场景2: 编辑链接回填 (?e_name=...) — 只在生成器端(制作时)生效
  if (prefillFromEditUrl()) {
    syncPageMeta();  // 重新同步 <title> 和生成器页标题
    renderQr();
    toast('已载入证书信息,可继续编辑');
    return;
  }

  // 场景3: 默认生成器
  renderQr();
});
</script>
