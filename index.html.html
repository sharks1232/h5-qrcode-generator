<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #eaf4fb;
    color: #2c3e50;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ============ 生成器页面 ============ */
  .gen-page {
    max-width: 540px;
    margin: 0 auto;
    padding: 14px 14px 90px;
  }
  .gen-header {
    background: linear-gradient(135deg, #1e88e5, #1976d2);
    color: #fff;
    padding: 18px 16px;
    border-radius: 12px;
    margin-bottom: 14px;
    box-shadow: 0 4px 16px rgba(25,118,210,.25);
  }
  .gen-header h1 { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
  .gen-header p { font-size: 12px; opacity: .9; line-height: 1.5; }
  /* 生成器页标题/描述也是可编辑的 */
  .gen-header h1 input {
    width: 100%;
    background: rgba(255,255,255,.15);
    color: #fff;
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 18px;
    font-weight: 600;
    font-family: inherit;
    outline: none;
    transition: border-color .15s, background .15s;
  }
  .gen-header h1 input:focus {
    border-color: rgba(255,255,255,.6);
    background: rgba(255,255,255,.22);
  }
  .gen-header p input {
    width: 100%;
    background: rgba(255,255,255,.15);
    color: #fff;
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    opacity: .95;
    font-family: inherit;
    outline: none;
    transition: border-color .15s, background .15s;
  }
  .gen-header p input::placeholder { color: rgba(255,255,255,.55); }
  .gen-header p input:focus {
    border-color: rgba(255,255,255,.6);
    background: rgba(255,255,255,.22);
  }

  .gen-card {
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,.06);
    margin-bottom: 14px;
  }
  .gen-card h2 {
    font-size: 15px;
    margin-bottom: 12px;
    color: #1976d2;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .gen-card h2::before {
    content: ''; width: 3px; height: 14px; background: #1976d2; border-radius: 2px;
  }
  .field-row { display: flex; gap: 10px; margin-bottom: 10px; }
  .field { flex: 1; display: flex; flex-direction: column; }
  .field label {
    font-size: 12px; color: #6b7c93; margin-bottom: 4px; font-weight: 500;
  }
  .field input, .field select, .field textarea {
    border: 1px solid #dfe6ef;
    border-radius: 8px;
    padding: 9px 10px;
    font-size: 14px;
    outline: none;
    transition: border-color .15s;
    font-family: inherit;
    background: #f8fafc;
    width: 100%;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    border-color: #1976d2;
    background: #fff;
  }
  .field textarea { resize: vertical; min-height: 38px; }

  /* 照片上传 */
  .photo-uploader { display: flex; align-items: center; gap: 12px; }
  .photo-preview {
    width: 72px; height: 96px;
    border: 1px dashed #c0cfde;
    border-radius: 6px;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background: #f8fafc;
    flex-shrink: 0;
    color: #b0bec5; font-size: 11px;
  }
  .photo-preview img { width: 100%; height: 100%; object-fit: cover; }
  .photo-actions { flex: 1; }
  .photo-actions input[type="file"] { display: none; }
  .photo-actions label, .photo-btn {
    display: inline-block;
    padding: 7px 12px;
    background: #e3f2fd;
    color: #1976d2;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    margin-right: 6px;
    margin-bottom: 6px;
    border: none;
  }
  .photo-actions label:active, .photo-btn:active { background: #bbdefb; }
  .photo-actions .tip { display: block; margin-top: 4px; font-size: 11px; color: #94a8bf; line-height: 1.5; }

  /* 按钮 */
  .btn-row { display: flex; gap: 10px; margin-top: 14px; }
  .btn {
    flex: 1;
    padding: 11px 12px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: transform .1s, opacity .15s;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: #1976d2; color: #fff; }
  .btn-secondary { background: #e3f2fd; color: #1976d2; }
  .btn-block { width: 100%; }

  /* 二维码预览 */
  .qr-preview {
    text-align: center;
    padding: 18px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,.06);
    margin-bottom: 14px;
  }
  .qr-preview h3 { margin-bottom: 12px; color: #1976d2; font-size: 15px; }
  .qr-box {
    display: flex; justify-content: center; align-items: center;
    padding: 14px;
    background: #fff;
    border: 1px solid #e3f2fd;
    border-radius: 10px;
    margin-bottom: 12px;
    min-height: 220px;
  }
  #qrcode img { display: block; }
  .qr-placeholder { color: #b0bec5; font-size: 13px; line-height: 1.6; }
  .qr-meta {
    font-size: 11px; color: #6b7c93;
    background: #f8fafc; padding: 8px; border-radius: 6px;
    word-break: break-all; line-height: 1.5;
    text-align: left;
    max-height: 60px;
    overflow-y: auto;
  }

  /* ============ 证书展示页面 ============ */
  .cert-page {
    display: none;
    background: #eaf4fb;
    min-height: 100vh;
    padding: 14px 12px 30px;
  }
  .cert-page.active { display: block; }
  .cert-card {
    background: #fff;
    border-radius: 12px;
    padding: 22px 18px;
    max-width: 480px;
    margin: 0 auto;
    box-shadow: 0 2px 10px rgba(0,0,0,.05);
  }
  .cert-title {
    text-align: center;
    font-size: 20px;
    font-weight: 700;
    color: #2c3e50;
    line-height: 1.4;
    margin: 0 8px 12px;
  }
  .cert-divider {
    height: 2px;
    background: #b3d9f2;
    margin: 0 0 24px;
    border-radius: 1px;
  }
  .cert-row {
    display: flex;
    margin-bottom: 14px;
    font-size: 15px;
    line-height: 1.5;
  }
  .cert-label {
    color: #2196f3;
    font-weight: 500;
    flex-shrink: 0;
    width: 90px;
  }
  .cert-value {
    color: #2c3e50;
    flex: 1;
    word-break: break-all;
    padding-right: 4px;
  }
  .cert-status-row {
    display: flex; align-items: center; margin-bottom: 18px;
    font-size: 15px;
  }
  .cert-status-row .cert-label { width: 90px; }
  .cert-status {
    display: inline-block;
    background: #22c55e;
    color: #fff;
    font-size: 14px;
    padding: 6px 16px;
    border-radius: 20px;
    font-weight: 500;
    margin-left: 8px;
  }
  .cert-status-row .cert-value { display: flex; align-items: center; }
  .cert-photo-wrap { text-align: center; margin: 8px 0 24px; }
  .cert-photo {
    width: 110px; height: 145px;
    object-fit: cover;
    border-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,.1);
    background: #f0f0f0;
  }
  .cert-photo-placeholder {
    width: 110px; height: 145px;
    display: flex; align-items: center; justify-content: center;
    color: #b0bec5; font-size: 12px;
    background: #f8fafc;
    border-radius: 4px;
    margin: 0 auto;
  }
  .cert-qr-section { text-align: center; margin-top: 16px; }
  .cert-qr-tip { font-size: 14px; color: #2c3e50; margin-bottom: 10px; }
  .cert-qr-img {
    width: 160px; height: 160px;
    border: 1px solid #f0f0f0;
    padding: 6px;
    background: #fff;
    border-radius: 6px;
  }

  /* Toast */
  .toast {
    position: fixed; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,.8);
    color: #fff;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    z-index: 9999;
    opacity: 0;
    transition: opacity .2s;
    pointer-events: none;
    max-width: 80%;
    text-align: center;
  }
  .toast.show { opacity: 1; }

  /* 错误提示 */
  .err-box {
    color: #c62828;
    background: #ffebee;
    border: 1px solid #ffcdd2;
    padding: 10px;
    border-radius: 6px;
    font-size: 12px;
    margin-top: 8px;
    word-break: break-all;
  }

  /* 警告提示(容量回退等) */
  .warn-box {
    color: #ef6c00;
    background: #fff3e0;
    border: 1px solid #ffe0b2;
    padding: 10px;
    border-radius: 6px;
    font-size: 12px;
    margin-top: 8px;
    word-break: break-all;
  }

  @media (min-width: 600px) {
    .gen-page { padding: 24px 24px 100px; }
  }
</style>
</head>
<body>

<!-- ============ 生成器页面 ============ -->
<div class="gen-page" id="genPage">
  <div class="gen-header">
    <h1><input type="text" id="f-genTitle" value="📋 H5 健康证明二维码生成器" placeholder="浏览器标题 & 生成器页标题"></h1>
    <p><input type="text" id="f-genDesc" value="填写信息 → 自动生成二维码 → 扫码即可在 H5 中打开验证页面" placeholder="生成器页副标题说明"></p>
  </div>

  <div class="gen-card">
    <h2>证书标题(显示在证书页最上方)</h2>
    <div class="field-row">
      <div class="field">
        <label>第一行(机构/类型)</label>
        <input id="f-title1" placeholder="如:广东省食品从业人员" value="广东省食品从业人员">
      </div>
      <div class="field">
        <label>第二行(证明名称)</label>
        <input id="f-title2" placeholder="如:健康证明验证" value="健康证明验证">
      </div>
    </div>
  </div>

  <div class="gen-card">
    <h2>证书基本信息</h2>

    <div class="field-row">
      <div class="field">
        <label>姓名</label>
        <input id="f-name" placeholder="如:黄冠旗" value="黄冠旗">
      </div>
      <div class="field">
        <label>性别</label>
        <select id="f-sex">
          <option value="男">男</option>
          <option value="女">女</option>
        </select>
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label>身份证号</label>
        <input id="f-id" placeholder="18位身份证号" value="440308*********491X">
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label>体检日期</label>
        <input id="f-date" placeholder="2026年08月06日" value="2026年08月06日">
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label>体检单位</label>
        <textarea id="f-org" placeholder="如:广州市疾病预防控制中心">广州市疾病预防控制中心</textarea>
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label>有效期</label>
        <input id="f-valid" placeholder="如:壹年" value="壹年">
      </div>
      <div class="field">
        <label>验证标签文字</label>
        <input id="f-status" placeholder="验证有效" value="验证有效">
      </div>
    </div>
  </div>

  <div class="gen-card">
    <h2>从业者照片(可选)</h2>
    <div class="photo-uploader">
      <div class="photo-preview" id="photoPreview">
        <span>暂无照片</span>
      </div>
      <div class="photo-actions">
        <label for="photoInput">📷 选择照片</label>
        <button class="photo-btn" id="clearPhoto" type="button">清除</button>
        <input type="file" id="photoInput" accept="image/*">
        <small class="tip">照片会编码进二维码,扫码后即可显示(照片过大时二维码可能无法生成)</small>
      </div>
    </div>
  </div>

  <div class="qr-preview">
    <h3>🔳 二维码预览</h3>
    <div class="qr-box">
      <div id="qrcode">
        <div class="qr-placeholder">正在生成二维码...</div>
      </div>
    </div>
    <div id="qrError"></div>
    <div class="qr-meta" id="qrUrl">填写信息后将自动生成</div>

    <div class="btn-row">
      <button class="btn btn-primary" id="downloadQr">⬇️ 下载二维码</button>
      <button class="btn btn-secondary" id="copyLink">📋 复制链接</button>
    </div>
  </div>
</div>

<!-- ============ 证书展示页面 ============ -->
<div class="cert-page" id="certPage">
  <div class="cert-card">
    <h1 class="cert-title" id="c-title">广东省食品从业人员<br>健康证明验证</h1>
    <div class="cert-divider"></div>

    <div class="cert-row">
      <div class="cert-label">姓名:</div>
      <div class="cert-value" id="c-name">-</div>
    </div>
    <div class="cert-row">
      <div class="cert-label">性别:</div>
      <div class="cert-value" id="c-sex">-</div>
    </div>
    <div class="cert-row">
      <div class="cert-label">身份证号:</div>
      <div class="cert-value" id="c-id">-</div>
    </div>
    <div class="cert-row">
      <div class="cert-label">体检日期:</div>
      <div class="cert-value" id="c-date">-</div>
    </div>
    <div class="cert-row">
      <div class="cert-label">体检单位:</div>
      <div class="cert-value" id="c-org">-</div>
    </div>
    <div class="cert-status-row">
      <div class="cert-label">有效期:</div>
      <div class="cert-value">
        <span id="c-valid">-</span>
        <span class="cert-status" id="c-status">验证有效</span>
      </div>
    </div>

    <div class="cert-photo-wrap" id="c-photo-wrap">
      <div class="cert-photo-placeholder" id="c-photo-placeholder">暂无照片</div>
    </div>

    <div class="cert-qr-section">
      <div class="cert-qr-tip">扫码再次验证</div>
      <img class="cert-qr-img" id="c-qr" src="" alt="验证二维码">
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
'use strict';

/* ============ 工具 ============ */
var $ = function(id) { return document.getElementById(id); };
function toast(msg) {
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 1800);
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

/* ============ 状态 ============ */
var photoDataUrl = '';   // 照片 base64 (不进二维码,只用于本机预览)
var lastQrDataUrl = '';  // 最近一次生成的二维码 dataURL,供下载用

/* ============ 数据收集 ============ */
function collectForm() {
  return {
    genTitle: $('f-genTitle').value.trim() || 'H5 健康证明二维码生成器',
    title1:  $('f-title1').value.trim() || '广东省食品从业人员',
    title2:  $('f-title2').value.trim() || '健康证明验证',
    name:    $('f-name').value.trim()   || '未填写',
    sex:     $('f-sex').value           || '男',
    id:      $('f-id').value.trim()     || '未填写',
    date:    $('f-date').value.trim()   || '未填写',
    org:     $('f-org').value.trim()    || '未填写',
    valid:   $('f-valid').value.trim()  || '壹年',
    status:  $('f-status').value.trim() || '验证有效'
  };
}

/* 构造证书页 URL (二维码内容) — 包含照片 URL(如有) */
function buildCertUrl(data, skipPhoto) {
  data = data || collectForm();
  var params = new URLSearchParams();
  params.set('cert', '1');
  for (var k in data) {
    // genDesc 不传证书页(只是生成器自己的副标题)
    if (k === 'genDesc') continue;
    if (data[k] && k !== 'photo') params.set(k, data[k]);
  }
  if (!skipPhoto && photoDataUrl) params.set('photo', photoDataUrl);
  // 必须用绝对 URL!微信扫一扫只认 http:// 开头,纯 /path 会识别成根路径
  return location.origin + location.pathname + '?' + params.toString();
}

/* 构造编辑链接 (生成器端回填用,不在证书页显示) */
function buildEditUrl(data) {
  data = data || collectForm();
  var params = new URLSearchParams();
  for (var k in data) {
    if (data[k]) params.set('e_' + k, data[k]);
  }
  return location.origin + location.pathname + '?' + params.toString();
}

/* ============ 二维码生成 (核心修复) ============ */
/* 用 QRCode.js 生成二维码,自绘 canvas,清晰且下载可靠 */
function makeQrDataUrl(text, pixelSize) {
  pixelSize = pixelSize || 220;
  try {
    var div = document.createElement('div');
    div.style.display = 'none';
    document.body.appendChild(div);
    new QRCode(div, {
      text: text,
      width: pixelSize,
      height: pixelSize,
      colorDark: '#000000',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M
    });
    // QRCode.js 生成的是 canvas 标签
    var canvas = div.querySelector('canvas');
    if (!canvas) {
      document.body.removeChild(div);
      return '';
    }
    var dataUrl = canvas.toDataURL('image/png');
    document.body.removeChild(div);
    return dataUrl;
  } catch (e) {
    console.error('QR 生成失败:', e);
    return '';
  }
}

function renderQr() {
  var data = collectForm();
  var url = buildCertUrl(data, false);
  // 容量保护: 二维码最长约 2953 字节。照片 base64 太大时无法入码,
  // 自动回退为不含照片的二维码,避免整页"生成失败"
  var photoDropped = false;
  if (url.length > 2953 && photoDataUrl) {
    url = buildCertUrl(data, true);
    photoDropped = true;
  }
  $('qrUrl').innerHTML = '<strong>扫码访问:</strong> ' + escapeHtml(url);
  $('qrError').innerHTML = photoDropped
    ? '<div class="warn-box">⚠️ 照片过大无法放入二维码,已生成不含照片的版本。需配服务器/云存储上传模式才能扫码显示照片。</div>'
    : '';

  var box = $('qrcode');
  box.innerHTML = '';

  try {
    var dataUrl = makeQrDataUrl(url, 220);
    if (!dataUrl) {
      throw new Error('二维码生成返回空');
    }
    lastQrDataUrl = dataUrl;
    var img = document.createElement('img');
    img.src = dataUrl;
    img.style.width = '220px';
    img.style.height = '220px';
    img.alt = '健康证明二维码';
    box.appendChild(img);
  } catch (e) {
    lastQrDataUrl = '';
    box.innerHTML = '<div class="qr-placeholder">❌ 生成失败: ' + escapeHtml(e.message) + '</div>';
    $('qrError').innerHTML = '<div class="err-box">' + escapeHtml(e.message) + '</div>';
  }
}

/* ============ 照片处理 ============ */
$('photoInput').addEventListener('change', function(e) {
  var file = e.target.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) {
    toast('照片不能超过 5MB');
    return;
  }
  // 1) 压缩到 300px 宽,jpg 0.7
  var reader = new FileReader();
  reader.onload = function(ev) {
    var img = new Image();
    img.onload = function() {
      var maxW = 300;
      var scale = Math.min(1, maxW / img.width);
      var w = Math.round(img.width * scale);
      var h = Math.round(img.height * scale);
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      var c = canvas.getContext('2d');
      c.drawImage(img, 0, 0, w, h);
      canvas.toBlob(function(blob) {
        if (!blob) { toast('照片处理失败'); return; }
        // 2) 上传到后端,拿到公网 URL
        uploadPhoto(blob);
      }, 'image/jpeg', 0.7);
    };
    img.onerror = function() { toast('照片读取失败'); };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

function uploadPhoto(blob) {
  toast('正在处理照片...');
  $('photoPreview').innerHTML = '<span>处理中...</span>';
  var reader = new FileReader();
  reader.onload = function(e) {
    photoDataUrl = e.target.result;
    $('photoPreview').innerHTML = '<img src="' + photoDataUrl + '">';
    renderQr();
    toast('照片已加入二维码');
  };
  reader.onerror = function() {
    photoDataUrl = '';
    $('photoPreview').innerHTML = '<span>处理失败</span>';
    toast('照片处理失败');
  };
  reader.readAsDataURL(blob);
}

$('clearPhoto').addEventListener('click', function() {
  photoDataUrl = '';
  $('photoPreview').innerHTML = '<span>暂无照片</span>';
  $('photoInput').value = '';
  toast('照片已清除');
});

/* ============ 输入联动 ============ */
var fieldIds = ['f-title1','f-title2','f-name','f-sex','f-id','f-date','f-org','f-valid','f-status'];
fieldIds.forEach(function(id) {
  $(id).addEventListener('input', renderQr);
  $(id).addEventListener('change', renderQr);
});

// 页面标题/副标题 — 同步浏览器 title + 重新生成二维码(genTitle 要编进 URL)
function syncPageMeta() {
  var t = $('f-genTitle').value.trim();
  if (t) $('pageTitle').textContent = t;
}
$('f-genTitle').addEventListener('input', function() {
  syncPageMeta();
  renderQr();   // genTitle 改了,二维码也要重新生成
});
$('f-genTitle').addEventListener('change', function() {
  syncPageMeta();
  renderQr();
});
$('f-genDesc').addEventListener('input', syncPageMeta);
$('f-genDesc').addEventListener('change', syncPageMeta);
syncPageMeta();

/* ============ 下载二维码 ============ */
$('downloadQr').addEventListener('click', function() {
  if (!lastQrDataUrl) {
    toast('请先填写信息生成二维码');
    return;
  }
  var a = document.createElement('a');
  a.download = '健康证明二维码.png';
  a.href = lastQrDataUrl;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  toast('二维码已下载');
});

/* ============ 复制链接 ============ */
$('copyLink').addEventListener('click', function() {
  var url = buildCertUrl();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(function() {
      toast('链接已复制');
    }).catch(function() {
      fallbackCopy(url);
    });
  } else {
    fallbackCopy(url);
  }
});
function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.top = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    toast('链接已复制');
  } catch (e) {
    toast('复制失败,请手动选中链接复制');
  }
  document.body.removeChild(ta);
}

/* ============ 证书页面渲染 (只读,无任何修改入口) ============ */
function showCertPage(data) {
  // 如果没传 data,尝试从 URL 读
  if (!data) {
    var params = new URLSearchParams(location.search);
    if (params.get('cert') === '1') {
      data = {
        genTitle: params.get('genTitle') || '',
        title1: params.get('title1') || '广东省食品从业人员',
        title2: params.get('title2') || '健康证明验证',
        name:   params.get('name')   || '-',
        sex:    params.get('sex')    || '-',
        id:     params.get('id')     || '-',
        date:   params.get('date')   || '-',
        org:    params.get('org')    || '-',
        valid:  params.get('valid')  || '壹年',
        status: params.get('status') || '验证有效'
      };
    } else {
      data = collectForm();
    }
  }

  // 渲染标题(两行,HTML escape 防注入)
  $('c-title').innerHTML = escapeHtml(data.title1) + '<br>' + escapeHtml(data.title2);
  // 同步浏览器 <title>(微信顶栏显示)— 用生成器传入的 genTitle,没有就用证书标题兜底
  var pageTitle = data.genTitle || (data.title1 + data.title2);
  if (!pageTitle) pageTitle = '健康证明验证';
  $('pageTitle').textContent = pageTitle;

  $('c-name').textContent   = data.name;
  $('c-sex').textContent    = data.sex;
  $('c-id').textContent     = data.id;
  $('c-date').textContent   = data.date;
  $('c-org').textContent    = data.org;
  $('c-valid').textContent  = data.valid;
  $('c-status').textContent = data.status;

  // 照片: 优先用 URL 参数里的 photo URL(任何人扫码都能看到),其次本机 localStorage 兜底
  var photo = '';
  if (data && data.photo) photo = data.photo;
  if (!photo) {
    var params = new URLSearchParams(location.search);
    photo = params.get('photo') || '';
  }
  if (!photo) {
    try { photo = localStorage.getItem('cert_photo') || ''; } catch (e) {}
  }
  var wrap = $('c-photo-wrap');
  if (photo) {
    wrap.innerHTML = '<img class="cert-photo" src="' + photo + '" alt="照片" crossorigin="anonymous">';
  } else {
    wrap.innerHTML = '<div class="cert-photo-placeholder">暂无照片</div>';
  }

  // 底部"再次验证"二维码 — 用本地库自绘 canvas,不依赖外部 API
  // 这次不加 photo(避免递归无限增长)
  var verifyUrl = buildCertUrl(data, true);
  var qrDataUrl = makeQrDataUrl(verifyUrl, 160);
  if (qrDataUrl) {
    $('c-qr').src = qrDataUrl;
  } else {
    $('c-qr').alt = '二维码生成失败';
  }

  $('genPage').style.display = 'none';
  $('certPage').classList.add('active');
  window.scrollTo(0, 0);
}

/* ============ 编辑链接回填 (生成器端用) ============ */
function prefillFromEditUrl() {
  var params = new URLSearchParams(location.search);
  var hasEdit = false;
  ['genTitle','genDesc','title1','title2','name','sex','id','date','org','valid','status'].forEach(function(k) {
    var v = params.get('e_' + k);
    if (v !== null) {
      var el = $('f-' + k);
      if (el) {
        el.value = v;
        hasEdit = true;
      }
    }
  });
  return hasEdit;
}

/* ============ 启动 ============ */
window.addEventListener('DOMContentLoaded', function() {
  // 检查库是否加载成功
  if (typeof QRCode === 'undefined') {
    $('qrcode').innerHTML = '<div class="qr-placeholder">❌ 二维码库加载失败,请刷新页面重试</div>';
    $('qrError').innerHTML = '<div class="err-box">二维码库未加载,请刷新页面重试</div>';
    return;
  }

  var params = new URLSearchParams(location.search);

  // 场景1: 扫码进入证书页 (?cert=1) — 只读,无修改入口
  if (params.get('cert') === '1') {
    showCertPage();
    return;
  }

  // 场景2: 编辑链接回填 (?e_name=...) — 只在生成器端(制作时)生效
  if (prefillFromEditUrl()) {
    syncPageMeta();  // 重新同步 <title> 和生成器页标题
    renderQr();
    toast('已载入证书信息,可继续编辑');
    return;
  }

  // 场景3: 默认生成器
  renderQr();
});
</script>
</body>
</html>
